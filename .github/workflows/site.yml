name: Build and deploy site
on:
  push:
    branches:
      - main
  schedule:
    # Daily at 00:05 UTC: promotes any drafts whose date has arrived.
    - cron: '5 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codecrew-www-deploy
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: radiusred/gh-codecrew
          path: _sources/gh-codecrew
      # Build with uv.lock's zensical, the one the tests ran against: an unpinned
      # install let the live site drift from the tested build (#32, #61).
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python sync_docs.py
        env:
          SYNC_SOURCE_BASE: _sources
      - run: uv run python main.py
      - run: uv run zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
