[project]
site_name = "CodeCrew"
site_description = "Agent-driven software delivery, with the receipts kept in GitHub. A protocol, five role contracts, and a gh extension CLI."
site_author = "Radius Red Ltd."
site_url = "https://codecrew.works/"
copyright = """
Copyright &copy; 2026 Radius Red Ltd.
"""

nav = [
  { "Home" = "index.md" },
  # BEGIN_DOCS_NAV
  { "Docs" = [
    { "Introduction" = "docs/index.md" },
    { "Your first milestone" = "docs/first-milestone.md" },
    { "Identities" = "docs/identities.md" },
    { "Local extensions" = "docs/extensions.md" },
    { "Platform interop" = "docs/platform-interop.md" },
    { "Founding decisions" = "docs/founding-decisions.md" },
    { "GSD vs. \"just let the model orchestrate\"" = "docs/gsd-vs-frontier-orchestration.md" },
    { "CodeCrew Protocol Specification" = "docs/spec.md" },
    { "Milestones" = [
      { "Milestones" = "docs/milestones/index.md" },
      { "M1: Role contracts and CLI skeleton" = "docs/milestones/1-role-contracts-and-cli-skeleton.md" },
      { "M2: Protocol hardening" = "docs/milestones/2-protocol-hardening.md" },
      { "M3: First spoke" = "docs/milestones/3-first-spoke.md" },
      { "M4: Solo flight" = "docs/milestones/4-solo-flight.md" },
      { "M5: Crew expansion" = "docs/milestones/5-crew-expansion.md" },
      { "M6: Polish and 1.0" = "docs/milestones/6-polish-and-1-0.md" },
      { "M7: The coordinator seat and platform interop" = "docs/milestones/7-the-coordinator-seat-and-platform-interop.md" },
    ] },
    { "Contributing" = "docs/contributing.md" },
    { "Security" = "docs/security.md" },
  ] },
  # END_DOCS_NAV
  { "Blog" = [
    { "Latest" = "blog/index.md" },
    # BEGIN_BLOG_POSTS
    # END_BLOG_POSTS
    { "All posts..." = "blog/archive.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
custom_dir = "docs/overrides"
favicon = "assets/images/favicon.png"
logo = "assets/images/logo.png"
language = "en"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.extra]
generator = false
# Fixed localStorage scope so the 404 page shares the saved palette with real
# pages. Keep in sync with site_url's path if the site ever moves.
scope = "/"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/radiusred/gh-codecrew"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/bluesky"
link = "https://bsky.app/profile/radiusred.bsky.social"
name = "Bluesky"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/company/radiusred"
name = "LinkedIn"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:hello@radiusred.uk"
name = "Email"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
