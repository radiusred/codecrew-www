[project]
site_name = "CodeCrew"
site_description = "Agent-driven software delivery, with the receipts kept in GitHub. A protocol, five role contracts, and a gh extension CLI."
site_author = "Radius Red Ltd."
site_url = "https://codecrew.works/"
copyright = """
Copyright &copy; 2026 Radius Red Ltd.
"""

nav = [
  { "Home" = "index.md" },
  { "Blog" = [
    { "Latest" = "blog/index.md" },
    # BEGIN_BLOG_POSTS
    # END_BLOG_POSTS
    { "All posts..." = "blog/archive.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
custom_dir = "docs/overrides"
favicon = "assets/images/favicon.png"
logo = "assets/images/logo.png"
language = "en"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.extra]
generator = false
# Fixed localStorage scope so the 404 page shares the saved palette with real
# pages. Keep in sync with site_url's path if the site ever moves.
scope = "/"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/radiusred/gh-codecrew"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/bluesky"
link = "https://bsky.app/profile/radiusred.bsky.social"
name = "Bluesky"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/company/radiusred"
name = "LinkedIn"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:hello@radiusred.uk"
name = "Email"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
